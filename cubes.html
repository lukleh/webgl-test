<!DOCTYPE html>
<html>
<head>
<title>WebGL cubes</title>
    <link rel="stylesheet" href="css/main.css" />
    <!-- Import maps for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
        }
      }
    </script>
    <!-- External libraries from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/screenfull.js/5.2.0/screenfull.min.js"></script>

    <script src="js/detect_webgl.js"></script>
    <script src="js/run_demo.js"></script>
    <script src="js/utils.js"></script>

<body onLoad="LL.runDemo(LL.run_cubes);">
